name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intellimeet
          POSTGRES_PASSWORD: intellimeet
          POSTGRES_DB: intellimeet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellimeet -d intellimeet"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://intellimeet:intellimeet@localhost:5432/intellimeet
      TEST_DATABASE_URL: postgresql+psycopg://intellimeet:intellimeet@localhost:5432/intellimeet_test
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the api image
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check

      # Includes the API contract check (docs/openapi.json) and the golden-set retrieval gate.
      # Live-LLM tests are skipped (RUN_LLM_TESTS unset): CI has no Ollama.
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generated API types match the contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date with docs/openapi.json. Run 'npm run gen:api' and commit."
            exit 1
          }

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build api and frontend images
        run: docker compose build
